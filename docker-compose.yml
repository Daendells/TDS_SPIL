networks:
  spil_tds:
    driver: bridge

volumes:
  mysql_data:

services:
  # MySQL Database
  tds_db:
    image: mysql:8.0
    container_name: tds_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: tds
      MYSQL_USER: tds_user
      MYSQL_PASSWORD: tds_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - spil_tds
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API
  tds_backend:
    container_name: tds_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./backend/.env
    environment:
      # Override untuk Docker environment
      DB_HOST: tds_db
      DB_PORT: 3306
      DB_NAME: tds
      DB_USER: tds_user
      DB_PASSWORD: tds_password
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      tds_db:
        condition: service_healthy
    networks:
      - spil_tds

  # Frontend
  tds_frontend:
    container_name: tds_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./frontend/.env
    environment:
      # Override untuk Docker environment
      NODE_ENV: production
      INTERNAL_API_ENDPOINT: http://tds_backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - tds_backend
    networks:
      - spil_tds