version: "3.8"

volumes:
  backend_storage:
  mysql_data:

services:
  mysql:
    container_name: mysql-container
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tds
      MYSQL_USER: tds_user
      MYSQL_PASSWORD: tds_pass
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - tds-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tds_backend:
    container_name: tds_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Database connection
      DB_HOST: mysql-container
      DB_PORT: 3306
      DB_USER: tds_user
      DB_PASSWORD: tds_pass
      DB_NAME: tds

      # Application settings
      WEB_PORT: 8080
      ENV: development
      GIN_MODE: debug

      # Add other env vars as needed
      JWT_SECRET_KEY: your-secret-key
      # GROQ_API_KEY: your-groq-key
    ports:
      - "8080:8080"
    volumes:
      - backend_storage:/app/storage
      - ./backend/public:/app/public:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tds-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  tds_frontend:
    container_name: tds_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_ENDPOINT: http://localhost:8081
      WATCHPACK_POLLING: true
      CHOKIDAR_USEPOLLING: true
      JWT_SECRET: your-secret-key
    ports:
      - "3000:3000"
    volumes:
      # Bind mount source code for hot reload
      - ./frontend:/app
      # Prevent node_modules from being overwritten
      - /app/node_modules
      - /app/.next
    depends_on:
      tds_backend:
        condition: service_healthy
    networks:
      - tds-net

networks:
  tds-net:
    driver: bridge
