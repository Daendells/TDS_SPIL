services:
  # ─────────────────────────────────────────────
  # NOTE: MySQL tidak didefinisikan di sini.
  # Shared dengan tds-devto_normal via external network.
  # Pastikan mysql-container sudah jalan dari tds-devto_normal dulu.
  # ─────────────────────────────────────────────

  tds_backend:
    container_name: tds_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Database (shared mysql-container)
      DB_HOST: mysql-container
      DB_PORT: 3306
      DB_USER: tds_user
      DB_PASS: tds_pass
      DB_NAME: tds

      # Application
      WEB_PORT: 8080
      ENV: development
      GIN_MODE: debug
      LOG_LEVEL: 4

      # JWT — HARUS sama dengan frontend JWT_SECRET
      JWT_SECRET_KEY: talent-development-system-secret

      # SSO (opsional, biarkan kosong jika tidak dipakai)
      SSO_BASE_URL: ${SSO_BASE_URL:-http://host.docker.internal:5000}
      SSO_FRONTEND_URL: ${SSO_FRONTEND_URL:-http://localhost:5173}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_CALLBACK_URL: ${SSO_CALLBACK_URL:-http://localhost:8081/api/auth/sso/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}

      # Google OAuth for Sheets Sync
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3001/spreadsheet-analytics/google-callback}

    ports:
      - "8081:8080"   # Port 8081 agar tidak konflik dengan tds-devto_normal (8080)
    volumes:
      - backend_storage:/app/storage
      - ./backend/public:/app/public:ro
    networks:
      - tds-devto_tds-net   # Sambung ke network shared (tempat mysql-container berada)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  tds_frontend:
    container_name: tds_frontend_devto
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # Backend diakses dari host (bukan dari dalam Docker network)
      NEXT_PUBLIC_API_ENDPOINT: http://localhost:8081
      NEXT_PUBLIC_SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      # JWT — HARUS sama dengan backend JWT_SECRET_KEY
      JWT_SECRET: talent-development-system-secret
    ports:
      - "3001:3000"   # Port 3001 agar tidak konflik dengan tds-devto_normal (3000)
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      tds_backend:
        condition: service_healthy
    networks:
      - tds-devto_tds-net

volumes:
  backend_storage:

networks:
  tds-devto_tds-net:
    external: true   # Pakai network yang sudah ada (dari tds-devto_normal / mysql)