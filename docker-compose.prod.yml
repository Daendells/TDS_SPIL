version: "3.8"

volumes:
  backend_storage:

services:
  tds_backend:
    container_name: tds_backend_prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      # Database connection - EXTERNAL DATABASE
      DB_HOST: ${DB_HOST} # IP atau hostname database eksternal
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-tds}

      # Application settings
      WEB_PORT: 8080
      ENV: production
      GIN_MODE: release

      # Security
      JWT_SECRET: ${JWT_SECRET}

      # LLM API (if using)
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8080:8080"
    volumes:
      - backend_storage:/app/storage
      # NOTE: NO bind mount untuk source code di production!
    networks:
      - tds-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  tds_frontend:
    container_name: tds_frontend_prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:-http://localhost:8080}
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:-http://localhost:8080}
    ports:
      - "3000:3000"
    # NOTE: NO volumes/bind mount untuk source code di production!
    depends_on:
      tds_backend:
        condition: service_healthy
    networks:
      - tds-net

networks:
  tds-net:
    driver: bridge
